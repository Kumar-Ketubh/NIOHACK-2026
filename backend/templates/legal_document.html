<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>{{ title }}</title>
    <style>
        @page {
            size: a4 portrait;
            margin: 2cm;
            @frame footer {
                -pdf-frame-content: footerContent;
                bottom: 1cm;
                margin-left: 2cm;
                margin-right: 2cm;
                height: 1cm;
            }
        }
        body {
            font-family: Helvetica, Arial, sans-serif;
            font-size: 11pt;
            line-height: 1.6;
            color: #333;
        }
        h1 {
            text-align: center;
            font-size: 18pt;
            font-weight: bold;
            margin-bottom: 30px;
            text-transform: uppercase;
            border-bottom: 2px solid #000;
            padding-bottom: 10px;
        }
        .clause {
            margin-bottom: 20px;
            page-break-inside: avoid;
        }
        .translated-text {
            font-size: 12pt;
            color: #000;
            margin-bottom: 8px;
            text-align: justify;
        }
        .original-text {
            font-size: 9pt;
            color: #666;
            font-style: italic;
            border-left: 3px solid #ccc;
            padding-left: 10px;
            text-align: justify;
        }
        #footerContent {
            text-align: right;
            font-size: 8pt;
            color: #999;
        }
    </style>
</head>
<body>
    <h1>{{ title }}</h1>
    
    {% for clause in clauses %}
    <div class="clause">
        <div class="translated-text">{{ clause.translated }}</div>
        <div class="original-text">{{ clause.original }}</div>
    </div>
    {% endfor %}

    <div id="footerContent">
        Generated by Legality - AI Legal Translation
        &nbsp;&nbsp;&nbsp; Page <pdf:pagenumber> of <pdf:pagecount>
    </div>
</body>
</html>
